<section id="tab-content-substitution" class="tab-pane flex-1 min-h-0 h-full flex flex-col space-y-2">

        <div class="flex flex-wrap justify-between items-center gap-3 shrink-0">

            <div class="flex items-center space-x-2">

                Official EduPage Module
              </span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">

          <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg border border-slate-200 dark:border-slate-700">

          <div class="flex flex-wrap items-center gap-3">
            <!-- Date Input -->
            <div class="flex items-center space-x-1.5">
              <label for="subst-date-input" class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase">Date:</label>
              <input type="date" id="subst-date-input" value="2026-09-02" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg p-1.5 font-medium">

              <div class="inline-flex rounded-lg border border-slate-300 dark:border-slate-700 p-0.5 bg-white dark:bg-slate-800">
                <button onclick="setSubstMode('classes')" id="subst-mode-classes" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-blue-600 text-white shadow-2xs">
                  Classes
                </button>
                <button onclick="setSubstMode('teachers')" id="subst-mode-teachers" class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                  Teachers
                </button>
              </div>
            </div>
          </div>

          <!-- Refresh Button -->
          <button onclick="loadSubstitution()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-2xs transition flex items-center gap-1.5">

        <!-- Substitution Content Render Container (Scrollable internally) -->

            <span class="text-3xl">⏳</span>
            <div class="text-sm font-semibold text-slate-700 dark:text-slate-300">Loading substitution report...</div>
          </div>
        </div>
